{% extends "layout.html" %} {% block title %}ประชาสัมพันธ์{% endblock %} {%
block content %}
<section class="page-banner">
  <div>
    <h2>ประชาสัมพันธ์</h2>
    <p class="banner-subtitle">ADVERTISE</p>
  </div>
</section>
<main>
  <div class="container">
    <div class="header-section">
      <h1 id="pageTitle" class="header-title">กำลังโหลด...</h1>
      <select id="categoryFilter" class="filter-select">
        <option value="all">ทั้งหมด</option>
      </select>
    </div>

    <div id="loading" class="loading">กำลังดึงข้อมูลจาก Google Sheets...</div>
    <div id="newsGrid" class="news-grid"></div>
  </div>
</main>

<script>
  {
    // --- การตั้งค่า (CONFIG) ---
    const SHEET_ID = "1MssMgNiDmuRcGQNYi0pUylPMoUPjxMTu9f9Sslfe0mM";
    const GID = "0";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

    // --- ตั้งค่าคอลัมน์ (Index เริ่มที่ 0) ---
    // A=0, B=1, C=2, D=3, E=4
    const COL_CATEGORY = 0; // Col A: ประเภทงาน
    const COL_DATE = 1; // Col B: วันที่
    const COL_TITLE = 2; // Col C: หัวข้อเรื่อง
    const COL_LINK = 3; // Col D: Link URL
    const COL_IMG = 4; // Col E: Image URL

    let allData = [];

    // ฟังก์ชันหลักเริ่มทำงาน
    async function init() {
      try {
        const response = await fetch(CSV_URL);
        const text = await response.text();

        // แปลง CSV เป็น Array
        const rows = parseCSV(text);

        // ข้าม Header (row 0) และ map ข้อมูล
        allData = rows
          .slice(1)
          .map((row, index) => {
            // กรองแถวว่าง (ต้องมีหัวข้อเรื่อง)
            if (!row[COL_TITLE]) return null;

            return {
              order: index,
              sortDate: parseThaiDate(row[COL_DATE]),
              category: row[COL_CATEGORY] ? row[COL_CATEGORY].trim() : "ทั่วไป",
              date: row[COL_DATE] || "",
              title: row[COL_TITLE],
              link: row[COL_LINK] ? row[COL_LINK].trim() : "#",
              image: convertDriveImageLink(row[COL_IMG]), // แปลงลิ้งค์รูปภาพ
            };
          })
          .filter((item) => item !== null)
          // เรียงใหม่ล่าสุดขึ้นก่อน (วันเดียวกัน: แถวที่เพิ่มทีหลังใน Sheet ขึ้นก่อน)
          .sort((a, b) => (b.sortDate || 0) - (a.sortDate || 0) || b.order - a.order);

        setupDropdown();
        renderCards(allData);

        document.getElementById("loading").style.display = "none";
        document.getElementById("pageTitle").innerText = "ประชาสัมพันธ์ข่าวสาร";
      } catch (error) {
        console.error(error);
        document.getElementById("loading").innerText =
          "เกิดข้อผิดพลาดในการดึงข้อมูล";
      }
    }

    // ฟังก์ชันสร้าง Dropdown Filter
    function setupDropdown() {
      const select = document.getElementById("categoryFilter");
      const categories = [...new Set(allData.map((d) => d.category))];

      categories.forEach((cat) => {
        if (cat) {
          const option = document.createElement("option");
          option.value = cat;
          option.innerText = cat;
          select.appendChild(option);
        }
      });

      select.addEventListener("change", (e) => {
        const filter = e.target.value;
        const titleElem = document.getElementById("pageTitle");

        if (filter === "all") {
          renderCards(allData);
          titleElem.innerText = "ประชาสัมพันธ์ข่าวสาร";
        } else {
          const filtered = allData.filter((item) => item.category === filter);
          renderCards(filtered);
          titleElem.innerText = `หมวดหมู่: ${filter}`;
        }
      });
    }

    // ฟังก์ชันแสดงผลการ์ด
    function renderCards(data) {
      const grid = document.getElementById("newsGrid");
      grid.innerHTML = "";

      // Animation Reset
      grid.classList.remove("fade-in");
      void grid.offsetWidth;
      grid.classList.add("fade-in");

      if (data.length === 0) {
        grid.innerHTML =
          '<p style="text-align:center; width:100%; color:#888;">ไม่พบข้อมูล</p>';
        return;
      }

      data.forEach((item) => {
        const targetAttr = item.link !== "#" ? 'target="_blank"' : "";

        const card = `
                    <a href="${item.link}" class="news-card" ${targetAttr}>
                        <div class="card-image">
                            <img src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.src='https://placehold.co/600x400?text=No+Image'">
                        </div>
                        <div class="card-content">
                            <div class="card-tag">${item.category}</div>
                            <div class="card-date">
                                 ${item.date}
                            </div>
                            <h3 class="card-title">${item.title}</h3>
                        </div>
                    </a>
                `;
        grid.innerHTML += card;
      });
    }

    // แปลงวันที่ d/m/yyyy รองรับทั้ง พ.ศ. (2569) และ ค.ศ. (2026)
    function parseThaiDate(text) {
      const m = (text || "").trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
      if (!m) return null;
      let year = parseInt(m[3], 10);
      if (year > 2400) year -= 543;
      const date = new Date(year, parseInt(m[2], 10) - 1, parseInt(m[1], 10));
      return isNaN(date) ? null : date;
    }

    // ฟังก์ชันแปลงลิงก์ Google Drive (ฉบับแก้ไข แก้ 404)
    function convertDriveImageLink(url) {
      if (!url) return '';

      // Regex ใหม่: ดึง ID แบบระบุตัวอักษรที่อนุญาต (กันความผิดพลาด)
      // รองรับทั้ง /file/d/ID/view และ /file/d/ID เฉยๆ
      const driveMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);

      if (driveMatch && driveMatch[1]) {
        // ใช้ลิงก์แบบ Thumbnail แทน (sz=w1000 คือขอรูปความกว้าง 1000px เพื่อความชัด)
        return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w1000`;
      }

      return url;
    }

    // ฟังก์ชันแปลง CSV (รองรับเครื่องหมายจุลภาคในข้อความ)
    function parseCSV(text) {
      let arr = [];
      let quote = false; // สถานะว่าอยู่ใน "..." หรือไม่
      let row = [];
      let col = "";

      for (let c = 0; c < text.length; c++) {
        let cc = text[c],
          nc = text[c + 1];

        if (cc === '"') {
          if (quote && nc === '"') {
            col += '"';
            ++c;
          } // "" -> "
          else {
            quote = !quote;
          }
        } else if (cc === "," && !quote) {
          row.push(col);
          col = "";
        } else if (cc === "\r" && nc === "\n" && !quote) {
          row.push(col);
          col = "";
          arr.push(row);
          row = [];
          ++c;
        } else if (cc === "\n" && !quote) {
          row.push(col);
          col = "";
          arr.push(row);
          row = [];
        } else if (cc === "\r" && !quote) {
          row.push(col);
          col = "";
          arr.push(row);
          row = [];
        } else {
          col += cc;
        }
      }
      if (col !== "") row.push(col);
      if (row.length > 0) arr.push(row);
      return arr;
    }

    // Run
    init();
  }
</script>
{% endblock %}
