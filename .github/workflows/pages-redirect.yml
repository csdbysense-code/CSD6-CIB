# เดิม workflow นี้อัปโหลดทั้ง repo ขึ้น GitHub Pages ทำให้มีเว็บซ้ำที่
# https://csdbysense-code.github.io/CSD6-CIB/ (แสดง README และเปิดดู app.py / templates ได้)
# ตอนนี้อัปโหลดเฉพาะโฟลเดอร์ pages/ ซึ่งเป็นหน้าพาไปยังเว็บไซต์จริง + บอก Google ไม่ให้เก็บหน้านี้
# ถ้าปิด GitHub Pages ใน Settings → Pages แล้ว สามารถลบไฟล์นี้และโฟลเดอร์ pages/ ได้
name: GitHub Pages redirect

on:
  push:
    branches: ["main"]
    paths:
      - "pages/**"
      - ".github/workflows/pages-redirect.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "pages"
      - id: deployment
        uses: actions/deploy-pages@v4
